; Super-OS co-processor firmware: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM)
; Build from PowerShell/cmd (PlatformIO refuses MSYS/Git-bash):   pio run -e esp32s3zero
[env:esp32s3zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -Wall
